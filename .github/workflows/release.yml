name: Build Linux release executable

on:
  release:
    types: [created]

permissions:
  contents: write

jobs:
  build-linux-x64:
    runs-on: ubuntu-22.04

    steps:
      - name: Check out the release tag
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.release.tag_name }}

      - name: Set up Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Set package version from the release name
        env:
          RELEASE_VERSION: ${{ github.event.release.name }}
        run: npm version "$RELEASE_VERSION" --no-git-tag-version --ignore-scripts

      - name: Build the Linux x64 executable
        run: npm run package:linux

      - name: Upload executable to the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "${{ github.event.release.tag_name }}" dist/chatgpt-tui-linux-x64 --clobber
